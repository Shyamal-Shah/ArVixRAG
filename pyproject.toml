[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxivrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=4.0.0",
    "langchain>=1.3.4",
    "llama-index>=0.14.22",
    "loguru>=0.7.3",
    "markitdown>=0.1.6",
    "openai>=2.41.0",
    "openrouter>=0.9.1",
    "pgvector>=0.4.2",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["arxivrag*"]
exclude = ["data*", "notebooks*"]
